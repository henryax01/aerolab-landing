services:
  mongo:
    image: mongo:7
    container_name: aerolab-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: aerolab-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/landing-project
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: aerolab-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
